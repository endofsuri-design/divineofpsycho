<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DIVINE OF PSYCHO | Suri Esports Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 16px 12px 40px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #141b2d;
      padding: 22px 18px;
      border-radius: 18px;
      border: 1px solid #232d42;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
    }
    .brand-section {
      text-align: center;
      margin-bottom: 20px;
    }
    .brand-logo {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      background: #000;
      padding: 4px;
      border: 3px solid #ff385c;
      box-shadow: 0 0 18px rgba(255, 56, 92, 0.45);
    }
    .brand-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      margin-top: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .brand-subtitle {
      color: #ff385c;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }
    .support-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 22px;
    }
    .support-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 700;
      background: #1e2640;
      border: 1px solid #2c3859;
      transition: 0.15s;
    }
    .support-btn:active { transform: scale(0.97); }

    .section-title {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Video UI Mode Selection */
    .selection-box {
      background: #0e1424;
      border: 1px solid #232d42;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
    }
    .grid-formats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .btn-fmt {
      background: #182238;
      border: 1px solid #2c3859;
      color: #cbd5e1;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-fmt.active {
      background: #ff385c;
      border-color: #ff385c;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 56, 92, 0.4);
    }

    .grid-ammo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn-ammo {
      background: #182238;
      border: 1px solid #2c3859;
      color: #94a3b8;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
    }
    .btn-ammo.active {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      color: #22c55e;
    }

    select {
      width: 100%;
      background: #141b2d;
      border: 1px solid #2c3859;
      color: #fff;
      padding: 13px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      margin-bottom: 12px;
    }
    select:focus { border-color: #ff385c; }

    .matrix-display {
      display: flex;
      justify-content: space-around;
      background: #141b2d;
      border: 1px dashed #2c3859;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .matrix-col .lbl { font-size: 9.5px; font-weight: 800; color: #94a3b8; letter-spacing: 0.5px; }
    .matrix-col .val { font-size: 18px; font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
    .matrix-col .val.fee { color: #22c55e; }
    .matrix-col .val.prize { color: #ff385c; }

    /* Scan & Pay Card */
    .upi-box {
      border: 1px dashed #00e5ff;
      background: rgba(0, 229, 255, 0.04);
      border-radius: 14px;
      padding: 16px 14px;
      text-align: center;
      margin-bottom: 20px;
    }
    .upi-box p { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; }
    .upi-id-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0b0f19;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #00e5ff;
      margin-bottom: 12px;
    }
    .upi-id-badge span {
      font-weight: 800;
      color: #00e5ff;
      font-size: 14.5px;
      font-family: 'JetBrains Mono', monospace;
    }
    .copy-btn {
      background: #1e2640;
      border: none;
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
    }
    .qr-frame {
      width: 160px;
      height: 160px;
      background: #fff;
      padding: 5px;
      border-radius: 10px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-frame img { width: 100%; height: 100%; object-fit: contain; }
    .pay-app-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #2ed573;
      color: #0b0f19;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 800;
      border-radius: 10px;
      text-align: center;
    }

    /* Form Fields */
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 10.5px;
      color: #94a3b8;
      margin-bottom: 5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #232d42;
      background-color: #0b0f19;
      color: #fff;
      font-size: 13.5px;
      outline: none;
      transition: 0.2s;
    }
    input:focus { border-color: #ff385c; }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff385c, #ff6b81);
      color: white;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 18px rgba(255, 56, 92, 0.4);
    }
    .submit-btn:active { transform: scale(0.98); }
    #statusText {
      text-align: center;
      font-size: 12px;
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="brand-section">
    <img src="https://i.ibb.co/BHfXBCNN/logo.png" alt="DIVINE OF PSYCHO" class="brand-logo">
    <h1 class="brand-title">DIVINE OF PSYCHO</h1>
    <p class="brand-subtitle">SURI ESPORTS TOURNAMENTS 🪽</p>
  </div>

  <div class="section-title">Official Admin Channels</div>
  <div class="support-grid">
    <a href="https://whatsapp.com/channel/0029Vb90behJuyAGTTbZY53z" target="_blank" class="support-btn" style="color: #25d366;">📢 WA Channel</a>
    <a href="https://t.me/divineofpsycho" target="_blank" class="support-btn" style="color: #0088cc;">✈️ Telegram</a>
    <a href="https://instagram.com/siuuu_xri" target="_blank" class="support-btn" style="color: #e1306c;">📸 Instagram</a>
    <a href="https://api.whatsapp.com/send?phone=260953484261&text=Hello%20Admin%20Suri%20Esports" target="_blank" class="support-btn" style="color: #ffbb00;">📞 Admin Chat</a>
  </div>

  <div class="section-title">1. Choose Game Format & Mode</div>
  <div class="selection-box">
    <div class="grid-formats">
      <button type="button" class="btn-fmt" id="fmt1" onclick="pickFormat('1V1')">1V1</button>
      <button type="button" class="btn-fmt" id="fmt2" onclick="pickFormat('2V2')">2V2</button>
      <button type="button" class="btn-fmt" id="fmt3" onclick="pickFormat('3V3')">3V3</button>
      <button type="button" class="btn-fmt active" id="fmt4" onclick="pickFormat('4V4')">4V4</button>
    </div>

    <div class="grid-ammo">
      <button type="button" class="btn-ammo" id="ammoLtd" onclick="pickAmmo('Limited Ammo')">LIMITED AMMO</button>
      <button type="button" class="btn-ammo active" id="ammoUnl" onclick="pickAmmo('Unlimited Ammo')">UNLIMITED AMMO</button>
    </div>

    <label style="margin-bottom:6px;">SELECT TOURNAMENT TIER</label>
    <select id="tierSelector" onchange="onTierChanged()">
      <option value="50_85">Entry: ₹50 | Prize Pool: ₹85</option>
      <option value="70_120">Entry: ₹70 | Prize Pool: ₹120</option>
      <option value="100_175" selected>Entry: ₹100 | Prize Pool: ₹175</option>
      <option value="200_365">Entry: ₹200 | Prize Pool: ₹365</option>
    </select>

    <div class="matrix-display">
      <div class="matrix-col">
        <div class="lbl">ENTRY FEE</div>
        <div class="val fee" id="dispFee">₹100</div>
      </div>
      <div class="matrix-col">
        <div class="lbl">PRIZE POOL</div>
        <div class="val prize" id="dispPrize">₹175</div>
      </div>
    </div>
  </div>

  <div class="section-title">Step 2: Scan & Pay Entry Fee</div>
  <div class="upi
