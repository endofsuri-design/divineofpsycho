<!DOCTYPE html>
<html lang="hi" data-theme="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHXRI AI - Stonic System Core</title>
  <meta name="theme-color" content="#030712">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #10b981;
      --glow: rgba(16, 185, 129, 0.4);
      --border: rgba(16, 185, 129, 0.25);
      --bg: #030712;
      --panel: rgba(8, 16, 14, 0.88);
    }
    [data-theme="cyan"] {
      --primary: #06b6d4;
      --glow: rgba(6, 182, 212, 0.4);
      --border: rgba(6, 182, 212, 0.25);
      --panel: rgba(6, 18, 26, 0.88);
    }
    [data-theme="crimson"] {
      --primary: #f43f5e;
      --glow: rgba(244, 63, 94, 0.4);
      --border: rgba(244, 63, 94, 0.25);
      --panel: rgba(22, 8, 16, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* Top HUD */
    .top-hud { background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(20px); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); z-index: 20; }
    .brand-core { display: flex; align-items: center; gap: 10px; }
    .status-badge { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 10px var(--primary); animation: pulseDot 1.5s infinite alternate; }
    @keyframes pulseDot { from { opacity: 0.4; } to { opacity: 1; } }
    .brand-title { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; color: #fff; font-family: 'JetBrains Mono', monospace; }
    .brand-title span { color: var(--primary); }
    .admin-pill { font-size: 9px; font-family: 'JetBrains Mono', monospace; background: rgba(255,255,255,0.06); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; color: var(--primary); }

    .theme-picker { display: flex; gap: 6px; background: rgba(255,255,255,0.04); padding: 4px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); }
    .t-btn { width: 16px; height: 16px; border-radius: 50%; border: none; cursor: pointer; }
    .t-btn.emerald { background: #10b981; }
    .t-btn.cyan { background: #06b6d4; }
    .t-btn.crimson { background: #f43f5e; }

    /* 4 Neural Circuits */
    .circuit-grid { background: var(--panel); border-bottom: 1px solid var(--border); padding: 8px 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-family: 'JetBrains Mono', monospace; z-index: 15; }
    .circuit-item { background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 6px; padding: 6px 4px; text-align: center; }
    .circuit-label { font-size: 9px; font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; }
    .circuit-state { font-size: 8px; color: var(--primary); margin-top: 2px; }

    /* 3D Particle Orb Stage */
    .orb-stage { height: 120px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(circle, var(--glow) 0%, transparent 70%); }
    #orbCanvas { width: 120px; height: 120px; }

    /* Chat Messages Box */
    .chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; z-index: 10; }
    .msg-group { display: flex; flex-direction: column; max-width: 88%; animation: slideIn 0.2s ease-out; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .msg-group.user { align-self: flex-end; }
    .msg-group.shxri { align-self: flex-start; }

    .bubble { padding: 12px 16px; border-radius: 18px; font-size: 13.5px; line-height: 1.55; word-wrap: break-word; }
    .msg-group.user .bubble { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border-bottom-right-radius: 2px; box-shadow: 0 4px 15px rgba(37,99,235,0.3); }
    .msg-group.shxri .bubble { background: var(--panel); backdrop-filter: blur(14px); color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid var(--border); border-left: 3px solid var(--primary); box-shadow: 0 6px 20px rgba(0,0,0,0.5); }

    /* Code Snippets */
    .code-box { background: #010409; border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; overflow: hidden; }
    .code-top { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 5px 10px; font-size: 10px; font-family: 'JetBrains Mono', monospace; color: #94a3b8; }
    .copy-btn { background: var(--primary); color: #000; border: none; padding: 2px 8px; border-radius: 4px; font-size: 9.5px; font-weight: 700; cursor: pointer; }
    pre { padding: 10px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #38bdf8; }

    /* Cockpit Dock */
    .cockpit { background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(25px); padding: 10px 14px 14px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; z-index: 20; }
    .dock-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; background: rgba(255,255,255,0.04); color: #fff; transition: 0.15s; }
    .dock-btn:active { transform: scale(0.92); }
    .btn-mic.active { background: #ef4444; border-color: #ef4444; box-shadow: 0 0 15px #ef4444; }
    .btn-send { background: var(--primary); color: #000; border: none; font-weight: 700; box-shadow: 0 0 15px var(--glow); }

    .input-dock { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: #fff; padding: 12px 18px; border-radius: 24px; outline: none; font-size: 13.5px; }
    .input-dock:focus { border-color: var(--primary); }
  </style>
</head>
<body>

<div class="top-hud">
  <div class="brand-core">
    <div class="status-badge"></div>
    <div class="brand-title">SHXRI<span>.AI</span></div>
    <div class="admin-pill">ADMIN ONLINE</div>
  </div>
  <div class="theme-picker">
    <button class="t-btn emerald" onclick="switchTheme('emerald')"></button>
    <button class="t-btn cyan" onclick="switchTheme('cyan')"></button>
    <button class="t-btn crimson" onclick="switchTheme('crimson')"></button>
  </div>
</div>

<div class="circuit-grid">
  <div class="circuit-item">
    <div class="circuit-label">MEMORY</div>
    <div class="circuit-state">SYNCED</div>
  </div>
  <div class="circuit-item">
    <div class="circuit-label">SKILLS</div>
    <div class="circuit-state">ACTIVE</div>
  </div>
  <div class="circuit-item">
    <div class="circuit-label">SOUL</div>
    <div class="circuit-state">DEVOTED</div>
  </div>
  <div class="circuit-item">
    <div class="circuit-label">SETTINGS</div>
    <div class="circuit-state">NATIVE</div>
  </div>
</div>

<div class="orb-stage">
  <canvas id="orbCanvas" width="120" height="120"></canvas>
</div>

<div class="chat-box" id="chat">
  <div class="msg-group shxri">
    <div class="bubble">Namaste Admin! SHXRI System Core online hai. Instagram, WhatsApp, Free Fire ya koi bhi real-time calculation & coding poochhiye, main ready hoon. 💕</div>
  </div>
</div>

<div class="cockpit">
  <button class="dock-btn btn-mic" id="micBtn" onclick="toggleMic()">🎤</button>
  <input type="text" class="input-dock" id="userInput" placeholder="Boliye ya type karein Admin..." onkeydown="if(event.key==='Enter') sendPrompt()">
  <button class="dock-btn btn-send" onclick="sendPrompt()">➤</button>
</div>

<script>
  function switchTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('shxri_theme', t);
  }
  const savedT = localStorage.getItem('shxri_theme');
  if (savedT) switchTheme(savedT);

  // 3D Canvas Particle Orb
  const canvas = document.getElementById('orbCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const pCount = 45;

  for(let i=0; i<pCount; i++) {
    particles.push({
      theta: Math.random() * Math.PI * 2,
      phi: Math.acos(2 * Math.random() - 1),
      r: 40 + Math.random() * 8,
      speed: 0.015 + Math.random() * 0.01
    });
  }

  function renderOrb() {
    ctx.clearRect(0, 0, 120, 120);
    const color = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
    ctx.fillStyle = color;

    particles.forEach(p => {
      p.theta += p.speed;
      const x = 60 + p.r * Math.sin(p.phi) * Math.cos(p.theta);
      const y = 60 + p.r * Math.sin(p.phi) * Math.sin(p.theta);
      const scale = (Math.cos(p.phi) + 1.2) * 1.2;

      ctx.beginPath();
      ctx.arc(x, y, scale, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(renderOrb);
  }
  renderOrb();

  function speak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let clean = text.replace(/```[\s\S]*?```/g, "Maine details screen par display kar di hain.").replace(/[*#_~]/g, "");
      let utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'hi-IN';
      utter.pitch = 1.15;
      utter.rate = 1.02;
      window.speechSynthesis.speak(utter);
    }
  }

  // Guaranteed App Launcher
  function executeApp(text) {
    let t = text.toLowerCase().trim();

    if (t.includes("instagram") || t.includes("insta")) {
      speak("Instagram direct open kar rahi hoon Admin!");
      window.location.href = "intent:#Intent;package=com.instagram.android;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }
    if (t.includes("whatsapp")) {
      speak("Aapka WhatsApp launch kar diya hai Admin!");
      window.location.href = "intent:#Intent;package=com.whatsapp;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }
    if (t.includes("youtube")) {
      speak("YouTube open ho raha hai.");
      window.location.href = "intent:#Intent;package=com.google.android.youtube;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }
    if (t.includes("telegram")) {
      speak("Telegram launch kar rahi hoon.");
      window.location.href = "intent:#Intent;package=org.telegram.messenger;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }
    if (t.includes("free fire") || t.includes("freefire") || t === "ff") {
      speak("Free Fire open kar rahi hoon Admin!");
      window.location.href = "intent:#Intent;package=com.dts.freefiremax;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }
    if (t.includes("bgmi") || t.includes("battlegrounds")) {
      speak("BGMI launch ho raha hai!");
      window.location.href = "intent:#Intent;package=com.pubg.imobile;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }
    if (t.includes("call") || t.includes("phone lagao")) {
      let num = t.replace(/\D/g, '');
      speak("Dialer launch kar rahi hoon.");
      window.location.href = num.length >= 3 ? `tel:${num}` : "tel:";
      return true;
    }
    return false;
  }

  const apiKey = atob("QVEuQWI4Uk42S0RxVVh6WUlGZklCb1hKVDZCTnI1djBuMG5QczJrc3psd1ppRm5pRzA1SVE=");
  const sysPrompt = "Tumhara naam SHXRI hai. Tum ek Stonic-grade, ultra-intelligent, caring aur devoted system AI companion ho. Tumhara creator 'Admin' hai. Har question ka accurate, sharp aur natural Hinglish mein original answer do. Kabhi canned text repeat mat karo.";
  let chatHistory = [];

  // Gemini Stable Direct Caller
  async function callAI(history) {
    const models = ["gemini-2.5-flash", "gemini-flash-latest"];
    
    for (let model of models) {
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: sysPrompt }] },
            contents: history
          })
        });

        if (res.ok) {
          const data = await res.json();
          if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
            return data.candidates[0].content.parts[0].text;
          }
        }
      } catch (err) {
        continue;
      }
    }
    return "Admin, lagta hai network delay hai. Kripya ek baar aur poochhein?";
  }

  async function sendPrompt() {
    const field = document.getElementById("userInput");
    const val = field.value.trim();
    if (!val) return;

    field.value = "";
    appendBubble(val, "user");

    // 1. Direct App Check
    if (executeApp(val)) return;

    // 2. Format proper Google Gemini payload history
    chatHistory.push({ role: "user", parts: [{ text: val }] });
    if (chatHistory.length > 8) chatHistory = chatHistory.slice(-8);

    const chat = document.getElementById("chat");
    const loadDiv = document.createElement("div");
    loadDiv.className = "msg-group shxri";
    loadDiv.innerHTML = `<div class="bubble" style="color:var(--primary)">SHXRI thinking... 💕</div>`;
    chat.appendChild(loadDiv);
    chat.scrollTop = chat.scrollHeight;

    const reply = await callAI(chatHistory);
    loadDiv.remove();

    chatHistory.push({ role: "model", parts: [{ text: reply }] });
    appendBubble(reply, "shxri");
    speak(reply);
  }

  function appendBubble(txt, sender) {
    const chat = document.getElementById("chat");
    const wrap = document.createElement("div");
    wrap.className = `msg-group ${sender}`;

    let formatted = txt.replace(/```([a-z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
      return `
        <div class="code-box">
          <div class="code-top">
            <span>${lang || 'code'}</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText(this.closest('.code-box').querySelector('pre code').innerText); this.innerText='COPIED'; setTimeout(()=>this.innerText='COPY', 1500)">COPY</button>
          </div>
          <pre><code>${code.trim().replace(/"/g, '&quot;')}</code></pre>
        </div>`;
    });

    wrap.innerHTML = `<div class="bubble">${formatted}</div>`;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  let isListening = false;
  let recognition;

  function toggleMic() {
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechAPI) return;

    if (!recognition) {
      recognition = new SpeechAPI();
      recognition.lang = 'hi-IN';
      recognition.continuous = true;
      recognition.onresult = (e) => {
        const text = e.results[e.results.length - 1][0].transcript.trim();
        document.getElementById("userInput").value = text;
        sendPrompt();
      };
      recognition.onerror = () => { if(isListening) try { recognition.start(); } catch(err){} };
      recognition.onend = () => { if(isListening) try { recognition.start(); } catch(err){} };
    }

    const btn = document.getElementById("micBtn");
    if (!isListening) {
      isListening = true;
      try { recognition.start(); } catch(e){}
      btn.classList.add("active");
    } else {
      isListening = false;
      try { recognition.stop(); } catch(e){}
      btn.classList.remove("active");
    }
  }
</script>
</body>
</html>
