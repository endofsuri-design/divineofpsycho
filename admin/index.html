<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>Suri Esports Admin</title><style>body{font-family:Arial;max-width:1000px;margin:30px auto;padding:0 15px}input,button,select{padding:10px;margin:4px}section{border:1px solid #ddd;padding:15px;margin:15px 0;border-radius:12px}.row{display:flex;flex-wrap:wrap;gap:5px}</style></head><body><h1>Suri Esports Admin</h1><section><h3>Admin login</h3><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">Login</button><span id="msg"></span></section><section><h3>Create tournament</h3><div class="row"><input id="name" placeholder="Name"><input id="game" value="Free Fire"><input id="fee" type="number" placeholder="Entry fee"><input id="prize" placeholder="Prize"><input id="slots" type="number" placeholder="Slots"><input id="start" placeholder="Start time"></div><button onclick="createT()">Create</button></section><section><h3>Registrations</h3><div id="regs">Login to load.</div></section><script>let token='';const A='/api';async function login(){let r=await fetch(A+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass.value})});let j=await r.json();if(j.token){token=j.token;msg.textContent=' Logged in';load()}else msg.textContent=' '+j.error}async function createT(){await fetch(A+'/tournaments',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({name:name.value,game:game.value,entry_fee:+fee.value,prize:prize.value,slots:+slots.value,start_at:start.value})});load()}async function load(){let r=await fetch(A+'/admin/registrations',{headers:{Authorization:'Bearer '+token}});let x=await r.json();regs.innerHTML=x.map(v=>`<p><b>${v.player_name}</b> — ${v.tournament} — ₹${v.utr?'paid ref '+v.utr:'?'} — <select onchange="st(${v.id},this.value)"><option>${v.status}</option><option>VERIFIED</option><option>REJECTED</option><option>PENDING</option></select></p>`).join('')||'No registrations';}async function st(id,status){await fetch(A+'/admin/registrations/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({status})});load()}</script></body></html>
