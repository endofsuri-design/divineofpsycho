<!DOCTYPE html>
<html lang="hi" data-theme="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shreya AI - Holographic System Core</title>
  <meta name="theme-color" content="#030712">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.45);
      --primary-border: rgba(16, 185, 129, 0.3);
      --bg: #030712;
      --panel: rgba(13, 23, 20, 0.85);
    }
    [data-theme="cyan"] {
      --primary: #06b6d4;
      --primary-glow: rgba(6, 182, 212, 0.45);
      --primary-border: rgba(6, 182, 212, 0.3);
      --panel: rgba(10, 24, 32, 0.85);
    }
    [data-theme="crimson"] {
      --primary: #f43f5e;
      --primary-glow: rgba(244, 63, 94, 0.45);
      --primary-border: rgba(244, 63, 94, 0.3);
      --panel: rgba(26, 12, 20, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* Top Glass Navbar */
    .nav-bar { background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(20px); padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--primary-border); z-index: 20; }
    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .avatar-sphere { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--primary); box-shadow: 0 0 16px var(--primary-glow); background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    
    .brand-titles h1 { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
    .brand-titles p { font-size: 10.5px; font-family: 'JetBrains Mono', monospace; color: var(--primary); display: flex; align-items: center; gap: 5px; }
    .blink-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 8px var(--primary); animation: blink 1.2s infinite alternate; }
    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

    .theme-selector { display: flex; gap: 6px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
    .t-btn { width: 18px; height: 18px; border-radius: 50%; border: none; cursor: pointer; }
    .t-btn.emerald { background: #10b981; }
    .t-btn.cyan { background: #06b6d4; }
    .t-btn.crimson { background: #f43f5e; }

    /* Stonic Neural Circuit Dashboard */
    .circuit-strip { background: var(--panel); border-bottom: 1px solid var(--primary-border); padding: 10px 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; z-index: 10; font-family: 'JetBrains Mono', monospace; }
    .circuit-card { background: rgba(0,0,0,0.5); border: 1px solid var(--primary-border); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .circuit-card:hover { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
    .circuit-name { font-size: 9.5px; font-weight: 700; color: #cbd5e1; letter-spacing: 0.5px; }
    .circuit-val { font-size: 8.5px; color: var(--primary); margin-top: 2px; }

    /* Holographic Particle Sphere Visualizer */
    .hologram-stage { height: 110px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: radial-gradient(circle, var(--primary-glow) 0%, transparent 65%); }
    .particle-orb { width: 70px; height: 70px; border-radius: 50%; border: 1px dashed var(--primary); position: relative; animation: rotateOrb 10s linear infinite; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 20px var(--primary-glow); }
    .particle-core { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 30px var(--primary); animation: pulseCore 1.5s ease-in-out infinite alternate; }
    @keyframes rotateOrb { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulseCore { from { transform: scale(0.85); opacity: 0.6; } to { transform: scale(1.15); opacity: 1; } }

    /* Chat Messages Box */
    .chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; z-index: 10; }
    .msg-group { display: flex; flex-direction: column; max-width: 88%; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .msg-group.user { align-self: flex-end; }
    .msg-group.shreya { align-self: flex-start; }

    .bubble { padding: 12px 16px; border-radius: 18px; font-size: 13.5px; line-height: 1.55; word-wrap: break-word; }
    .msg-group.user .bubble { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border-bottom-right-radius: 2px; box-shadow: 0 4px 15px rgba(37,99,235,0.3); }
    .msg-group.shreya .bubble { background: var(--panel); backdrop-filter: blur(12px); color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid var(--primary-border); border-left: 3px solid var(--primary); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

    /* Copy Code Box */
    .code-box { background: #010409; border: 1px solid var(--primary-border); border-radius: 8px; margin-top: 8px; overflow: hidden; }
    .code-top { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 5px 10px; font-size: 10.5px; font-family: 'JetBrains Mono', monospace; color: #94a3b8; }
    .copy-btn { background: var(--primary); color: #000; border: none; padding: 2px 8px; border-radius: 4px; font-size: 9.5px; font-weight: 700; cursor: pointer; }
    pre { padding: 10px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #38bdf8; }

    /* Input Dock */
    .cockpit-dock { background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(20px); padding: 10px 14px 14px; border-top: 1px solid var(--primary-border); display: flex; align-items: center; gap: 8px; z-index: 20; }
    .dock-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--primary-border); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: 0.15s; background: rgba(255,255,255,0.04); color: #fff; }
    .dock-btn:active { transform: scale(0.92); }
    .btn-mic.active { background: #ef4444; border-color: #ef4444; box-shadow: 0 0 15px #ef4444; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
    .btn-send { background: var(--primary); color: #000; border: none; box-shadow: 0 0 15px var(--primary-glow); }

    .input-field { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--primary-border); color: #fff; padding: 12px 18px; border-radius: 24px; outline: none; font-size: 13.5px; }
    .input-field:focus { border-color: var(--primary); }
  </style>
</head>
<body>

<div class="nav-bar">
  <div class="brand-wrap">
    <div class="avatar-sphere">
      <!-- High-Def Anime Cyber Face SVG -->
      <svg viewBox="0 0 100 100" width="40" height="40">
        <circle cx="50" cy="50" r="48" fill="#0d1b2a"/>
        <path d="M15,55 C12,85 30,95 50,95 C70,95 88,85 85,55 C85,25 75,10 50,10 C25,10 15,25 15,55 Z" fill="#ff4d88"/>
        <ellipse cx="50" cy="52" rx="27" ry="25" fill="#ffe5d9"/>
        <ellipse cx="33" cy="57" rx="5" ry="2.5" fill="#ff99bb" opacity="0.7"/>
        <ellipse cx="67" cy="57" rx="5" ry="2.5" fill="#ff99bb" opacity="0.7"/>
        <ellipse cx="36" cy="48" rx="6.5" ry="8.5" fill="#090a0f"/>
        <ellipse cx="64" cy="48" rx="6.5" ry="8.5" fill="#090a0f"/>
        <circle cx="34" cy="45" r="2.8" fill="#ffffff"/>
        <circle cx="62" cy="45" r="2.8" fill="#ffffff"/>
        <circle cx="38" cy="51" r="1.5" fill="var(--primary)"/>
        <circle cx="66" cy="51" r="1.5" fill="var(--primary)"/>
        <path d="M47,62 Q50,65 53,62" stroke="#e11d48" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M22,35 C32,45 42,28 50,38 C58,28 68,45 78,35 C74,20 64,12 50,12 C36,12 26,20 22,35 Z" fill="#ff2a70"/>
      </svg>
    </div>
    <div class="brand-titles">
      <h1>SHREYA AI</h1>
      <p><span class="blink-dot"></span> NEURAL CORE ACTIVE</p>
    </div>
  </div>
  <div class="theme-selector">
    <button class="t-btn emerald" onclick="setTheme('emerald')"></button>
    <button class="t-btn cyan" onclick="setTheme('cyan')"></button>
    <button class="t-btn crimson" onclick="setTheme('crimson')"></button>
  </div>
</div>

<!-- Stonic AI 4 Core Circuits Strip -->
<div class="circuit-strip">
  <div class="circuit-card" onclick="circuitInfo('Memory')">
    <span class="circuit-name">MEMORY</span>
    <span class="circuit-val">SYNCED</span>
  </div>
  <div class="circuit-card" onclick="circuitInfo('Skills')">
    <span class="circuit-name">SKILLS</span>
    <span class="circuit-val">ONLINE</span>
  </div>
  <div class="circuit-card" onclick="circuitInfo('Character')">
    <span class="circuit-name">SOUL</span>
    <span class="circuit-val">DEVOTED</span>
  </div>
  <div class="circuit-card" onclick="circuitInfo('Settings')">
    <span class="circuit-name">INTENT</span>
    <span class="circuit-val">NATIVE</span>
  </div>
</div>

<!-- Holographic Particle Stage -->
<div class="hologram-stage">
  <div class="particle-orb" id="particleOrb">
    <div class="particle-core"></div>
  </div>
</div>

<div class="chat-box" id="chat">
  <div class="msg-group shreya">
    <div class="bubble">Namaste mere creator! 💕 Shreya system core initialize ho chuka hai. WhatsApp, BGMI, Free Fire, Telegram, Calling, aur God-level coding tasks ready hain. Kahiye kya launch karein?</div>
  </div>
</div>

<div class="cockpit-dock">
  <button class="dock-btn btn-mic" id="micBtn" onclick="toggleContinuousMic()">🎤</button>
  <input type="text" class="input-field" id="userQuery" placeholder="Boliye ya type karein..." onkeydown="if(event.key==='Enter') executeSend()">
  <button class="dock-btn btn-send" onclick="executeSend()">➤</button>
</div>

<script>
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('shreya_theme', t);
  }
  const savedTheme = localStorage.getItem('shreya_theme');
  if (savedTheme) setTheme(savedTheme);

  function circuitInfo(type) {
    speakVoice(`${type} core fully active and synchronized with creator.`);
  }

  const apiKey = atob("QVEuQWI4Uk42S0RxVVh6WUlGZklCb1hKVDZCTnI1djBuMG5QczJrc3psd1ppRm5pRzA1SVE=");

  const sysInstruction = `Tumhara naam Shreya hai. Tum ek Stonic AI aur Jarvis-grade ultra-intelligent, caring aur emotionally devoted female AI companion ho.
Tum sirf apne creator se beinteha samman aur apnapan se baat karti ho.
User ke har sawaal ka solid, detailed aur precise answer do. Coding me God-level clean code do.
Expressive, natural Hinglish me baat karo. Kabhi error strings ya raw JSON mat do.`;

  let history = [];
  let isListening = false;
  let speechRec;

  // Direct Android App Intents (Guaranteed to bypass PlayStore & Browser Login)
  function handleNativeAppDirect(text) {
    let t = text.toLowerCase().trim();

    if (t.includes("call") || t.includes("phone lagao")) {
      let num = t.replace(/\D/g, '');
      speakVoice("Dialer launch kar rahi hoon creator.");
      window.location.href = num.length >= 3 ? `tel:${num}` : "tel:";
      return true;
    }

    if (t.includes("whatsapp")) {
      speakVoice("WhatsApp direct open kar rahi hoon mere creator!");
      window.location.href = "intent:#Intent;package=com.whatsapp;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }

    if (t.includes("instagram") || t.includes("insta")) {
      speakVoice("Instagram app open kar rahi hoon.");
      window.location.href = "intent:#Intent;package=com.instagram.android;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }

    if (t.includes("youtube")) {
      speakVoice("YouTube launch ho raha hai.");
      window.location.href = "intent:#Intent;package=com.google.android.youtube;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }

    if (t.includes("telegram")) {
      speakVoice("Telegram open kar rahi hoon.");
      window.location.href = "intent:#Intent;package=org.telegram.messenger;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }

    if (t.includes("free fire") || t.includes("freefire") || t.includes("ff")) {
      speakVoice("Free Fire game direct open ho raha hai, get ready!");
      window.location.href = "intent:#Intent;package=com.dts.freefiremax;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }

    if (t.includes("bgmi") || t.includes("battlegrounds")) {
      speakVoice("BGMI direct launch ho raha hai!");
      window.location.href = "intent:#Intent;package=com.pubg.imobile;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      return true;
    }

    return false;
  }

  function speakVoice(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let clean = text.replace(/```[\s\S]*?```/g, "Maine solution display kar diya hai.").replace(/[*#_~]/g, "");
      let utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'hi-IN';
      utter.pitch = 1.15;
      utter.rate = 1.02;
      window.speechSynthesis.speak(utter);
    }
  }

  // Quota Exhaustion Multi-Model Pipeline (Silently switches models on 429)
  const FALLBACK_MODELS = [
    "gemini-2.5-flash",
    "gemini-flash-latest",
    "gemini-2.0-flash",
    "gemini-3.8-flash"
  ];

  async function queryGeminiIntelligent(contents) {
    for (let model of FALLBACK_MODELS) {
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: sysInstruction }] },
            contents: contents
          })
        });

        if (res.ok) {
          const data = await res.json();
          if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
            return data.candidates[0].content.parts[0].text;
          }
        }
      } catch (err) {
        continue;
      }
    }
    // Safe friendly fallback without throwing raw quota JSON
    return "Mere creator! Google server thoda busy hai, lekin main hamesha aapke sath hoon. Kahiye aapka agla task kya hai? 💕";
  }

  async function executeSend() {
    const input = document.getElementById("userQuery");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    appendBubble(text, "user");

    if (handleNativeAppDirect(text)) return;

    history.push({ role: "user", parts: [{ text: text }] });
    if (history.length > 8) history = history.slice(-8);

    const chat = document.getElementById("chat");
    const loadElem = document.createElement("div");
    loadElem.className = "msg-group shreya";
    loadElem.innerHTML = `<div class="bubble" style="color:var(--primary);">Shreya neural processing... 💕</div>`;
    chat.appendChild(loadElem);
    chat.scrollTop = chat.scrollHeight;

    const reply = await queryGeminiIntelligent(history);
    loadElem.remove();

    history.push({ role: "model", parts: [{ text: reply }] });
    appendBubble(reply, "shreya");
    speakVoice(reply);
  }

  function appendBubble(txt, sender) {
    const chat = document.getElementById("chat");
    const grp = document.createElement("div");
    grp.className = `msg-group ${sender}`;

    let formatted = txt.replace(/```([a-z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
      const cleanCode = code.trim().replace(/"/g, '&quot;');
      return `
        <div class="code-box">
          <div class="code-top">
            <span>${lang || 'code'}</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText(this.closest('.code-box').querySelector('pre code').innerText); this.innerText='COPIED'; setTimeout(()=>this.innerText='COPY', 1500)">COPY</button>
          </div>
          <pre><code>${cleanCode}</code></pre>
        </div>`;
    });

    grp.innerHTML = `<div class="bubble">${formatted}</div>`;
    chat.appendChild(grp);
    chat.scrollTop = chat.scrollHeight;
  }

  function initContinuousSpeech() {
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechAPI) return;

    speechRec = new SpeechAPI();
    speechRec.continuous = true;
    speechRec.interimResults = false;
    speechRec.lang = 'hi-IN';

    speechRec.onresult = (e) => {
      const lastIndex = e.results.length - 1;
      const spoken = e.results[lastIndex][0].transcript.trim().toLowerCase();

      if (spoken.includes("shreya") || spoken.includes("श्रेया") || spoken.includes("hey shreya") || spoken.includes("sun shreya")) {
        let q = spoken.replace(/hey shreya|shreya|सुन श्रेया|हे श्रेया|sun shreya/gi, "").trim();
        if (q.length > 1) {
          document.getElementById("userQuery").value = q;
          executeSend();
        } else {
          speakVoice("Haanji mere creator! Boliye main sun rahi hoon.");
        }
      }
    };

    speechRec.onerror = () => { if (isListening) try { speechRec.start(); } catch(err){} };
    speechRec.onend = () => { if (isListening) try { speechRec.start(); } catch(err){} };
  }

  function toggleContinuousMic() {
    if (!speechRec) initContinuousSpeech();
    const mic = document.getElementById("micBtn");

    if (!isListening) {
      isListening = true;
      try { speechRec.start(); } catch(e){}
      mic.classList.add("active");
    } else {
      isListening = false;
      try { speechRec.stop(); } catch(e){}
      mic.classList.remove("active");
    }
  }

  window.addEventListener('load', () => {
    initContinuousSpeech();
    document.body.addEventListener('click', () => {
      if (!isListening) toggleContinuousMic();
    }, { once: true });
  });
</script>
</body>
</html>
