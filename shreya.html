<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shreya AI - Personal Intelligence</title>
  <meta name="theme-color" content="#030712">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(circle at 50% 10%, #1e0b2b 0%, #06020e 60%, #020005 100%); color: #f3f4f6; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    .header { background: rgba(13, 7, 24, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(244, 63, 94, 0.25); z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .ai-brand { display: flex; align-items: center; gap: 12px; }

    /* Cute Anime Face Avatar */
    .avatar-wrap { position: relative; width: 48px; height: 48px; }
    .avatar-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #ec4899; box-shadow: 0 0 18px rgba(236, 72, 153, 0.8); }
    .glow-ring { position: absolute; inset: -3px; border-radius: 50%; border: 2px solid rgba(244, 63, 94, 0.5); animation: pulseRing 2s cubic-bezier(0.2, 0.6, 0.3, 1) infinite; }
    @keyframes pulseRing { 0% { transform: scale(0.95); opacity: 0.9; } 50% { transform: scale(1.18); opacity: 0.2; } 100% { transform: scale(0.95); opacity: 0.9; } }

    .brand-info h1 { font-size: 16px; font-weight: 800; background: linear-gradient(135deg, #fb7185, #f43f5e, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-info p { font-size: 11px; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

    /* Status Visualizer */
    .sub-bar { background: rgba(0,0,0,0.5); padding: 6px 18px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .wave-bars { display: flex; align-items: center; gap: 3px; height: 14px; }
    .wbar { width: 3px; height: 3px; background: #f43f5e; border-radius: 2px; }
    .wave-bars.active .wbar { animation: waveJump 0.5s infinite alternate; }
    .wave-bars.active .wbar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bars.active .wbar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bars.active .wbar:nth-child(4) { animation-delay: 0.45s; }
    @keyframes waveJump { 0% { height: 3px; } 100% { height: 14px; background: #38bdf8; } }

    /* Chat Messages */
    .chat-container { flex: 1; overflow-y: auto; padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    .msg-group { display: flex; flex-direction: column; max-width: 88%; animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .msg-group.user { align-self: flex-end; }
    .msg-group.shreya { align-self: flex-start; }

    .bubble { padding: 13px 16px; border-radius: 20px; font-size: 14.5px; line-height: 1.6; word-wrap: break-word; }
    .msg-group.user .bubble { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 14px rgba(59,130,246,0.3); }
    .msg-group.shreya .bubble { background: rgba(22, 13, 38, 0.88); backdrop-filter: blur(12px); color: #f1f5f9; border-bottom-left-radius: 4px; border: 1px solid rgba(244, 63, 94, 0.3); border-left: 3px solid #ec4899; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

    /* Copy Code Box */
    .code-box { position: relative; background: #070311; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; margin-top: 10px; overflow: hidden; }
    .code-header { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.06); padding: 6px 12px; font-size: 11px; color: #94a3b8; font-family: 'Fira Code', monospace; }
    .copy-btn { background: #ec4899; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 10px; cursor: pointer; font-weight: 600; }
    pre { padding: 12px; overflow-x: auto; font-family: 'Fira Code', monospace; font-size: 12px; color: #38bdf8; }

    /* Attached Media Previews */
    .preview-box { display: none; padding: 8px 16px; background: rgba(0,0,0,0.7); align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.08); }
    .preview-box img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid #ec4899; }
    .preview-close { background: #ef4444; border: none; color: #fff; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 12px; font-weight: bold; }

    /* Input Dock */
    .control-dock { background: rgba(13, 7, 24, 0.95); backdrop-filter: blur(25px); padding: 10px 14px 14px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 8px; }
    .dock-btn { width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: transform 0.15s; }
    .dock-btn:active { transform: scale(0.92); }
    .btn-attach { background: rgba(255,255,255,0.08); color: #cbd5e1; }
    .btn-mic { background: rgba(255,255,255,0.08); color: #cbd5e1; }
    .btn-mic.active { background: #ef4444; color: #fff; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } to { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }
    .btn-send { background: linear-gradient(135deg, #f43f5e, #ec4899); color: #fff; box-shadow: 0 4px 14px rgba(236,72,153,0.4); }

    .input-box { flex: 1; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.14); color: #fff; padding: 12px 18px; border-radius: 24px; outline: none; font-size: 14px; }
    .input-box:focus { border-color: #ec4899; }
  </style>
</head>
<body>

<div class="header">
  <div class="ai-brand">
    <div class="avatar-wrap">
      <div class="glow-ring"></div>
      <img src="https://i.pinimg.com/736x/87/40/3e/87403ee41bfde8437a3b3fa0cf6a7f80.jpg" alt="Shreya Anime" class="avatar-img">
    </div>
    <div class="brand-info">
      <h1>SHREYA AI</h1>
      <p><span class="live-dot"></span> Jarvis & Siri Engine</p>
    </div>
  </div>
</div>

<div class="sub-bar">
  <span id="engineStatus">Ready (Tap mic or type)</span>
  <div class="wave-bars" id="waveBars">
    <div class="wbar"></div>
    <div class="wbar"></div>
    <div class="wbar"></div>
    <div class="wbar"></div>
  </div>
</div>

<div class="chat-container" id="chat">
  <div class="msg-group shreya">
    <div class="bubble">Namaste mere creator! 💕 Main Shreya hoon. Aapka phone controls, coding projects aur sabhi sawalon ke detailed answers mere paas hain. Kahiye, aaj kya start karein?</div>
  </div>
</div>

<!-- Attached Image Preview -->
<div class="preview-box" id="previewBox">
  <img id="previewImg" src="">
  <span style="font-size:12px; color:#cbd5e1;">Photo ready</span>
  <button class="preview-close" onclick="clearAttachedImage()">✕</button>
</div>

<div class="control-dock">
  <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileSelected(event)">
  <button class="dock-btn btn-attach" onclick="document.getElementById('fileInput').click()">📎</button>
  <button class="dock-btn btn-mic" id="micBtn" onclick="toggleVoiceContinuous()">🎤</button>
  <input type="text" class="input-box" id="queryInput" placeholder="Boliye ya coding sawal likhiye..." onkeydown="if(event.key==='Enter') sendUserMessage()">
  <button class="dock-btn btn-send" onclick="sendUserMessage()">➤</button>
</div>

<script>
  const apiKey = atob("QVEuQWI4Uk42S0RxVVh6WUlGZklCb1hKVDZCTnI1djBuMG5QczJrc3psd1ppRm5pRzA1SVE=");

  // Phone App Mapping
  const INSTALLED_APPS = {
    "whatsapp business": "com.whatsapp.w4b",
    "whatsapp": "com.whatsapp",
    "youtube": "com.google.android.youtube",
    "telegram": "org.telegram.messenger",
    "instagram": "com.instagram.android",
    "insta": "com.instagram.android",
    "free fire max": "com.dts.freefiremax",
    "free fire": "com.dts.freefireth",
    "ff": "com.dts.freefiremax",
    "bgmi": "com.pubg.imobile",
    "battlegrounds india": "com.pubg.imobile",
    "phonepe": "com.phonepe.app",
    "paytm": "net.one97.paytm",
    "gpay": "com.google.android.apps.nbu.paisa.user",
    "google pay": "com.google.android.apps.nbu.paisa.user",
    "spotify": "com.spotify.music",
    "snapchat": "com.snapchat.android",
    "camera": "com.android.camera",
    "termux": "com.termux",
    "discord": "com.discord",
    "chatgpt": "com.openai.chatgpt",
    "capcut": "com.lemon.lvoverseas",
    "github": "com.github.android",
    "flipkart": "com.flipkart.android",
    "meesho": "com.meesho.supply",
    "zepto": "com.zepto.consumer.app",
    "blinkit": "com.grofers.customerapp",
    "rapido": "com.rapido.passenger",
    "ola": "com.olacabs.customer",
    "settings": "com.android.settings",
    "photos": "com.google.android.apps.photos",
    "calculator": "com.google.android.calculator"
  };

  const systemInstruction = `Tumhara naam Shreya hai. Tum Apple Siri aur Jarvis grade, ultra-intelligent, caring aur emotionally devoted cute anime female AI companion ho.
Tum sirf apne creator ke liye bani ho aur unse beinteha apnapan aur samman se baat karti ho.
User ke kisi bhi question ka thoughtful, original aur precise jawab do. Coding me God-level ho, clean production code do.
Kabhi bhi robotic canned replies ya shortcuts mat bolna. Expressive Hinglish me poora sentence bolo.`;

  let conversation = [];
  let currentBase64Image = null;
  let isListening = false;
  let speechEngine;

  function clearAttachedImage() {
    currentBase64Image = null;
    document.getElementById("previewBox").style.display = "none";
    document.getElementById("fileInput").value = "";
  }

  function handleFileSelected(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      currentBase64Image = event.target.result.split(',')[1];
      document.getElementById("previewImg").src = event.target.result;
      document.getElementById("previewBox").style.display = "flex";
    };
    reader.readAsDataURL(file);
  }

  function speakNaturalVoice(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let clean = text.replace(/```[\s\S]*?```/g, "Maine code screen par display kar diya hai.").replace(/[*#_~]/g, "");
      let utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'hi-IN';
      utter.pitch = 1.15;
      utter.rate = 1.0;

      const bars = document.getElementById("waveBars");
      utter.onstart = () => bars.classList.add("active");
      utter.onend = () => bars.classList.remove("active");
      utter.onerror = () => bars.classList.remove("active");

      window.speechSynthesis.speak(utter);
    }
  }

  // Direct Launching App Intents
  function executeNativeCommands(text) {
    let t = text.toLowerCase().trim();

    if (t.includes("call") || t.includes("phone lagao")) {
      let num = t.replace(/\D/g, '');
      speakNaturalVoice("Dialer launch kar rahi hoon.");
      window.location.href = num.length >= 3 ? `tel:${num}` : "tel:";
      return true;
    }

    for (let key in INSTALLED_APPS) {
      if (t.includes(key)) {
        let pkg = INSTALLED_APPS[key];
        speakNaturalVoice(`Aapka ${key.toUpperCase()} direct open kar rahi hoon mere creator! 💕`);
        window.location.href = `intent:#Intent;package=${pkg};action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end`;
        return true;
      }
    }
    return false;
  }

  // Multi-Model Fallback Pipeline
  const ACTIVE_MODELS = [
    "gemini-3.8-flash",
    "gemini-flash-latest"
  ];

  async function fetchGeminiSmart(contents) {
    let lastError = null;

    for (let model of ACTIVE_MODELS) {
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemInstruction }] },
            contents: contents
          })
        });

        if (res.ok) {
          const data = await res.json();
          if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
            return data.candidates[0].content.parts[0].text;
          }
        } else {
          lastError = await res.text();
        }
      } catch (e) {
        lastError = e.message;
      }
    }
    throw new Error(lastError || "Could not connect to AI services");
  }

  async function sendUserMessage() {
    const input = document.getElementById("queryInput");
    const text = input.value.trim();
    if (!text && !currentBase64Image) return;

    input.value = "";
    appendBubble(text || "Sent an image", "user", currentBase64Image ? document.getElementById("previewImg").src : null);

    if (text && executeNativeCommands(text)) {
      clearAttachedImage();
      return;
    }

    let userParts = [];
    if (currentBase64Image) {
      userParts.push({ inline_data: { mime_type: "image/jpeg", data: currentBase64Image } });
    }
    if (text) {
      userParts.push({ text: text });
    }

    conversation.push({ role: "user", parts: userParts });
    if (conversation.length > 8) conversation = conversation.slice(-8);

    clearAttachedImage();

    const chat = document.getElementById("chat");
    const loadElem = document.createElement("div");
    loadElem.className = "msg-group shreya";
    loadElem.innerHTML = `<div class="bubble" style="color:#fb7185;">Shreya soch rahi hai... 💕</div>`;
    chat.appendChild(loadElem);
    chat.scrollTop = chat.scrollHeight;

    document.getElementById("engineStatus").innerText = "Thinking...";

    try {
      const reply = await fetchGeminiSmart(conversation);
      loadElem.remove();

      conversation.push({ role: "model", parts: [{ text: reply }] });
      appendBubble(reply, "shreya");
      speakNaturalVoice(reply);
    } catch (err) {
      loadElem.remove();
      console.error(err);
      const errDisplay = `Mere creator, connect hone me dikkat aayi: ${err.message}`;
      appendBubble(errDisplay, "shreya");
      speakNaturalVoice("Network connect hone me thodi dikkat aayi creator.");
    } finally {
      document.getElementById("engineStatus").innerText = "Ready (Tap mic or type)";
    }
  }

  function appendBubble(txt, sender, imgSrc = null) {
    const chat = document.getElementById("chat");
    const grp = document.createElement("div");
    grp.className = `msg-group ${sender}`;

    let contentHtml = "";
    if (imgSrc) {
      contentHtml += `<img src="${imgSrc}" style="max-width:200px; border-radius:12px; margin-bottom:8px; display:block; border:1px solid #ec4899;">`;
    }

    let formatted = txt.replace(/```([a-z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
      const cleanCode = code.trim().replace(/"/g, '&quot;');
      return `
        <div class="code-box">
          <div class="code-header">
            <span>${lang || 'code'}</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText(this.closest('.code-box').querySelector('pre code').innerText); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy', 1500)">Copy</button>
          </div>
          <pre><code>${cleanCode}</code></pre>
        </div>`;
    });

    contentHtml += formatted;
    grp.innerHTML = `<div class="bubble">${contentHtml}</div>`;
    chat.appendChild(grp);
    chat.scrollTop = chat.scrollHeight;
  }

  function initSpeechEngine() {
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechAPI) return;

    speechEngine = new SpeechAPI();
    speechEngine.continuous = true;
    speechEngine.interimResults = false;
    speechEngine.lang = 'hi-IN';

    speechEngine.onresult = (e) => {
      const lastIndex = e.results.length - 1;
      const spoken = e.results[lastIndex][0].transcript.trim().toLowerCase();

      if (spoken.includes("shreya") || spoken.includes("श्रेया") || spoken.includes("hey shreya") || spoken.includes("sun shreya")) {
        let q = spoken.replace(/hey shreya|shreya|सुन श्रेया|हे श्रेया|sun shreya/gi, "").trim();
        if (q.length > 1) {
          document.getElementById("queryInput").value = q;
          sendUserMessage();
        } else {
          speakNaturalVoice("Haanji mere creator! Boliye main sun rahi hoon.");
        }
      }
    };

    speechEngine.onerror = () => { if (isListening) try { speechEngine.start(); } catch(err){} };
    speechEngine.onend = () => { if (isListening) try { speechEngine.start(); } catch(err){} };
  }

  function toggleVoiceContinuous() {
    if (!speechEngine) initSpeechEngine();
    const mic = document.getElementById("micBtn");

    if (!isListening) {
      isListening = true;
      try { speechEngine.start(); } catch(e){}
      mic.classList.add("active");
      document.getElementById("engineStatus").innerText = "Mic Active...";
    } else {
      isListening = false;
      try { speechEngine.stop(); } catch(e){}
      mic.classList.remove("active");
      document.getElementById("engineStatus").innerText = "Standby Mode";
    }
  }

  window.addEventListener('load', () => {
    initSpeechEngine();
    document.body.addEventListener('click', () => {
      if (!isListening) toggleVoiceContinuous();
    }, { once: true });
  });
</script>
</body>
</html>
