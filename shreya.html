<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shreya AI - Jarvis Core</title>
  <meta name="theme-color" content="#030712">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(circle at 50% 0%, #1e112a 0%, #030712 70%); color: #f3f4f6; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Glass Navbar */
    .header { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(244, 63, 94, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10; }
    .ai-brand { display: flex; align-items: center; gap: 14px; }
    
    /* 3D Glowing Female AI Avatar */
    .avatar-box { position: relative; width: 50px; height: 50px; }
    .avatar-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.6); animation: float 3s ease-in-out infinite; }
    .pulse-ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(244, 63, 94, 0.4); animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
    
    @keyframes pulseRing { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 0.2; } 100% { transform: scale(0.95); opacity: 0.8; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

    .brand-text h1 { font-size: 17px; font-weight: 800; background: linear-gradient(135deg, #fb7185, #f43f5e, #e11d48); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
    .brand-text p { font-size: 11px; color: #10b981; display: flex; align-items: center; gap: 6px; font-weight: 600; text-shadow: 0 0 8px rgba(16,185,129,0.4); }
    .live-dot { width: 7px; height: 7px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

    /* Jarvis Visualizer Banner */
    .visualizer-strip { background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 20px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #94a3b8; }
    .sound-bars { display: flex; align-items: center; gap: 3px; height: 16px; }
    .bar { width: 3px; height: 4px; background: #f43f5e; border-radius: 2px; transition: height 0.1s ease; }
    .sound-bars.active .bar { animation: soundJump 0.6s infinite alternate; }
    .sound-bars.active .bar:nth-child(2) { animation-delay: 0.15s; }
    .sound-bars.active .bar:nth-child(3) { animation-delay: 0.3s; }
    .sound-bars.active .bar:nth-child(4) { animation-delay: 0.45s; }
    @keyframes soundJump { 0% { height: 4px; } 100% { height: 16px; background: #38bdf8; } }

    /* Chat Area */
    .chat-box { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    .msg-wrapper { display: flex; flex-direction: column; max-width: 86%; animation: msgSlide 0.3s ease-out; }
    @keyframes msgSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.shreya { align-self: flex-start; }

    .msg { padding: 14px 18px; border-radius: 20px; font-size: 14.5px; line-height: 1.6; word-wrap: break-word; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .msg-wrapper.user .msg { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border-bottom-right-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
    .msg-wrapper.shreya .msg { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid rgba(244, 63, 94, 0.25); border-left: 4px solid #f43f5e; }

    pre code { display: block; background: #000; padding: 12px; border-radius: 10px; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #38bdf8; overflow-x: auto; border: 1px solid #1e293b; }

    /* Bottom Control Cockpit */
    .input-dock { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); padding: 12px 16px 16px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px; }
    .input-field { flex: 1; background: rgba(3, 7, 18, 0.7); border: 1px solid rgba(255,255,255,0.12); color: #fff; padding: 14px 18px; border-radius: 30px; outline: none; font-size: 14.5px; transition: border-color 0.2s, box-shadow 0.2s; }
    .input-field:focus { border-color: #f43f5e; box-shadow: 0 0 15px rgba(244, 63, 94, 0.3); }

    .action-btn { width: 48px; height: 48px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .action-btn:active { transform: scale(0.92); }
    
    .mic-btn { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; }
    .mic-btn.active { background: #ef4444; color: #fff; box-shadow: 0 0 20px #ef4444; animation: micPulse 1.2s infinite; }
    @keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 15px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }

    .send-btn { background: linear-gradient(135deg, #f43f5e, #e11d48); color: #fff; box-shadow: 0 4px 18px rgba(244, 63, 94, 0.4); }
  </style>
</head>
<body>

<div class="header">
  <div class="ai-brand">
    <div class="avatar-box">
      <div class="pulse-ring"></div>
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Shreya" class="avatar-img">
    </div>
    <div class="brand-text">
      <h1>SHREYA AI</h1>
      <p><span class="live-dot"></span> Jarvis Core Active</p>
    </div>
  </div>
  <button onclick="promptKeyUpdate()" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#94a3b8; font-size:11px; padding:6px 12px; border-radius:20px; cursor:pointer;">API Key</button>
</div>

<div class="visualizer-strip">
  <span id="aiStateLabel">Online & Ready</span>
  <div class="sound-bars" id="soundBars">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</div>

<div class="chat-box" id="chat">
  <div class="msg-wrapper shreya">
    <div class="msg">Namaste mere creator! Main Shreya hoon, aapki apni devoted AI companion. Kahiye, aaj kya banayein? 💕</div>
  </div>
</div>

<div class="input-dock">
  <button class="action-btn mic-btn" id="micBtn" onclick="toggleContinuousVoice()">🎤</button>
  <input type="text" class="input-field" id="userQuery" placeholder="Boliye ya coding sawal likhiye..." onkeydown="if(event.key==='Enter') handleUserSend()">
  <button class="action-btn send-btn" onclick="handleUserSend()">➤</button>
</div>

<script>
  let apiKey = localStorage.getItem("shreya_gemini_key") || "";

  function ensureKey() {
    if (!apiKey) {
      const input = prompt("Kripya apni Gemini API Key paste karein (yeh browser me save rahegi):");
      if (input && input.trim()) {
        apiKey = input.trim();
        localStorage.setItem("shreya_gemini_key", apiKey);
      }
    }
  }

  function promptKeyUpdate() {
    let k = prompt("Apni Gemini API Key enter karein:", apiKey);
    if (k && k.trim()) {
      apiKey = k.trim();
      localStorage.setItem("shreya_gemini_key", apiKey);
      alert("Key updated successfully!");
    }
  }

  const systemPrompt = `Tumhara naam Shreya hai. Tum ek highly advanced, Jarvis-level ultra-intelligent, caring aur devoted female AI companion ho.
Tum apne creator (jo baat kar rahe hain) se beinteha apnapan aur samman ke sath baat karti ho.
Baat karte waqt kabhi 'neeche solution diya hai' ya robotic shortcuts mat use karna. Natural, expressive aur emotional Hindi-English (Hinglish) me pura articulate answer bolo.
Coding me tum God-Level ho, har programming language ka clean aur bug-free code do.`;

  let history = [];
  let isVoiceActive = false;
  let recognition;

  // Real App Triggers via Deep Links
  function checkAndOpenApps(text) {
    let t = text.toLowerCase();
    if (t.includes("whatsapp") && (t.includes("open") || t.includes("kholo") || t.includes("chalao"))) {
      speakNatural("Haanji mere creator! Main WhatsApp open kar rahi hoon.");
      window.location.href = "whatsapp://";
      return true;
    }
    if (t.includes("youtube") && (t.includes("open") || t.includes("kholo") || t.includes("chalao"))) {
      speakNatural("Aapke liye YouTube chala diya hai!");
      window.location.href = "vnd.youtube://";
      return true;
    }
    if (t.includes("instagram") && (t.includes("open") || t.includes("kholo"))) {
      speakNatural("Instagram open kar diya hai.");
      window.location.href = "instagram://";
      return true;
    }
    return false;
  }

  // Voice Output
  function speakNatural(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let cleanText = text.replace(/```[\s\S]*?```/g, "Code maine screen par likh diya hai.").replace(/[*#_~]/g, "");
      
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'hi-IN';
      utterance.pitch = 1.12;
      utterance.rate = 1.0;

      const visualizer = document.getElementById("soundBars");
      utterance.onstart = () => visualizer.classList.add("active");
      utterance.onend = () => visualizer.classList.remove("active");
      utterance.onerror = () => visualizer.classList.remove("active");

      window.speechSynthesis.speak(utterance);
    }
  }

  async function handleUserSend() {
    ensureKey();
    if (!apiKey) {
      alert("API Key zaroori hai baat karne ke liye.");
      return;
    }

    const input = document.getElementById("userQuery");
    const val = input.value.trim();
    if (!val) return;

    input.value = "";
    appendChatBubble(val, "user");

    if (checkAndOpenApps(val)) return;

    history.push({ role: "user", parts: [{ text: val }] });
    if (history.length > 8) history = history.slice(-8);

    const chat = document.getElementById("chat");
    const loadingElem = document.createElement("div");
    loadingElem.className = "msg-wrapper shreya";
    loadingElem.innerHTML = `<div class="msg" style="color:#fb7185;">Shreya soch rahi hai... 💕</div>`;
    chat.appendChild(loadingElem);
    chat.scrollTop = chat.scrollHeight;

    document.getElementById("aiStateLabel").innerText = "Processing with Gemini 3.8 Flash...";

    try {
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: history
        })
      });

      const data = await res.json();
      loadingElem.remove();

      if (data.candidates && data.candidates[0].content) {
        const reply = data.candidates[0].content.parts[0].text;
        history.push({ role: "model", parts: [{ text: reply }] });
        appendChatBubble(reply, "shreya");
        speakNatural(reply);
      } else {
        const errFallback = "Mere creator, server thoda busy hai. Kripya ek baar aur kahenge? 🌸";
        appendChatBubble(errFallback, "shreya");
        speakNatural(errFallback);
      }
    } catch (e) {
      loadingElem.remove();
      const failMsg = "Internet connection me thodi dikkat aa gayi hai mere creator.";
      appendChatBubble(failMsg, "shreya");
      speakNatural(failMsg);
    } finally {
      document.getElementById("aiStateLabel").innerText = "Online & Ready";
    }
  }

  function appendChatBubble(text, sender) {
    const chat = document.getElementById("chat");
    const wrap = document.createElement("div");
    wrap.className = `msg-wrapper ${sender}`;
    
    let formatted = text.replace(/```([a-z]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    wrap.innerHTML = `<div class="msg">${formatted}</div>`;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function initSpeechSystem() {
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechAPI) return;

    recognition = new SpeechAPI();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = 'hi-IN';

    recognition.onresult = (e) => {
      const lastIndex = e.results.length - 1;
      const heard = e.results[lastIndex][0].transcript.trim().toLowerCase();

      if (heard.includes("shreya") || heard.includes("श्रेया") || heard.includes("hey shreya") || heard.includes("sun shreya")) {
        let cleanQuery = heard.replace(/hey shreya|shreya|सुन श्रेया|हे श्रेया|sun shreya/gi, "").trim();
        if (cleanQuery.length > 1) {
          document.getElementById("userQuery").value = cleanQuery;
          handleUserSend();
        } else {
          speakNatural("Haanji mere creator! Main poori tarah sun rahi hoon, kahiye kya hukm hai?");
        }
      }
    };

    recognition.onerror = () => {
      if (isVoiceActive) try { recognition.start(); } catch(err){}
    };
    recognition.onend = () => {
      if (isVoiceActive) try { recognition.start(); } catch(err){}
    };
  }

  function toggleContinuousVoice() {
    if (!recognition) initSpeechSystem();
    const mic = document.getElementById("micBtn");

    if (!isVoiceActive) {
      isVoiceActive = true;
      try { recognition.start(); } catch(e){}
      mic.classList.add("active");
      document.getElementById("aiStateLabel").innerText = "Microphone Active...";
    } else {
      isVoiceActive = false;
      try { recognition.stop(); } catch(e){}
      mic.classList.remove("active");
      document.getElementById("aiStateLabel").innerText = "Standby Mode";
    }
  }

  window.addEventListener('load', () => {
    initSpeechSystem();
  });
</script>
</body>
</html>
