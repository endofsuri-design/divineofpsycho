<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shreya AI - Devoted Anime Jarvis</title>
  <meta name="theme-color" content="#030712">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(circle at 50% 10%, #200d2e 0%, #080312 60%, #020108 100%); color: #f3f4f6; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Glass Navbar */
    .header { background: rgba(13, 7, 24, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(244, 63, 94, 0.25); box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 10; }
    .ai-brand { display: flex; align-items: center; gap: 12px; }

    /* Cute Anime Glowing Avatar */
    .avatar-wrap { position: relative; width: 48px; height: 48px; }
    .avatar-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #ec4899; box-shadow: 0 0 18px rgba(236, 72, 153, 0.75); }
    .glow-ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(244, 63, 94, 0.5); animation: pulseRing 2s cubic-bezier(0.2, 0.6, 0.3, 1) infinite; }
    @keyframes pulseRing { 0% { transform: scale(0.95); opacity: 0.9; } 50% { transform: scale(1.18); opacity: 0.2; } 100% { transform: scale(0.95); opacity: 0.9; } }

    .brand-info h1 { font-size: 16px; font-weight: 800; background: linear-gradient(135deg, #fb7185, #f43f5e, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-info p { font-size: 11px; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

    /* Visualizer */
    .sub-bar { background: rgba(0,0,0,0.5); padding: 6px 18px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .wave-bars { display: flex; align-items: center; gap: 3px; height: 14px; }
    .wbar { width: 3px; height: 3px; background: #f43f5e; border-radius: 2px; }
    .wave-bars.active .wbar { animation: waveJump 0.5s infinite alternate; }
    .wave-bars.active .wbar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bars.active .wbar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bars.active .wbar:nth-child(4) { animation-delay: 0.45s; }
    @keyframes waveJump { 0% { height: 3px; } 100% { height: 14px; background: #38bdf8; } }

    /* Chat Area */
    .chat-container { flex: 1; overflow-y: auto; padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    .msg-group { display: flex; flex-direction: column; max-width: 88%; animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .msg-group.user { align-self: flex-end; }
    .msg-group.shreya { align-self: flex-start; }

    .bubble { padding: 13px 16px; border-radius: 20px; font-size: 14px; line-height: 1.55; word-wrap: break-word; }
    .msg-group.user .bubble { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 14px rgba(59,130,246,0.3); }
    .msg-group.shreya .bubble { background: rgba(22, 13, 38, 0.85); backdrop-filter: blur(12px); color: #f1f5f9; border-bottom-left-radius: 4px; border: 1px solid rgba(244, 63, 94, 0.3); border-left: 3px solid #ec4899; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

    /* Code Blocks with Copy Button */
    .code-box { position: relative; background: #070311; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; margin-top: 10px; overflow: hidden; }
    .code-header { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 6px 12px; font-size: 11px; color: #94a3b8; font-family: 'Fira Code', monospace; }
    .copy-btn { background: #ec4899; color: #fff; border: none; padding: 3px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; }
    pre { padding: 12px; overflow-x: auto; font-family: 'Fira Code', monospace; font-size: 12px; color: #38bdf8; }

    /* Attached Media Previews */
    .preview-box { display: none; padding: 8px 16px; background: rgba(0,0,0,0.6); align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.06); }
    .preview-box img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid #ec4899; }
    .preview-close { background: #ef4444; border: none; color: #fff; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 11px; }

    /* Cockpit Bar */
    .control-dock { background: rgba(13, 7, 24, 0.95); backdrop-filter: blur(25px); padding: 10px 14px 14px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 8px; }
    .dock-btn { width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: transform 0.15s; }
    .dock-btn:active { transform: scale(0.92); }
    .btn-attach { background: rgba(255,255,255,0.08); color: #cbd5e1; }
    .btn-mic { background: rgba(255,255,255,0.08); color: #cbd5e1; }
    .btn-mic.active { background: #ef4444; color: #fff; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } to { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }
    .btn-send { background: linear-gradient(135deg, #f43f5e, #ec4899); color: #fff; box-shadow: 0 4px 14px rgba(236,72,153,0.4); }

    .input-box { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.12); color: #fff; padding: 12px 16px; border-radius: 24px; outline: none; font-size: 14px; }
    .input-box:focus { border-color: #ec4899; }
  </style>
</head>
<body>

<div class="header">
  <div class="ai-brand">
    <div class="avatar-wrap">
      <div class="glow-ring"></div>
      <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=150&auto=format&fit=crop&q=80" alt="Shreya Anime" class="avatar-img">
    </div>
    <div class="brand-info">
      <h1>SHREYA AI</h1>
      <p><span class="live-dot"></span> Devoted & Live</p>
    </div>
  </div>
  <button onclick="changeKeyManual()" style="background:transparent; border:1px solid rgba(255,255,255,0.2); color:#cbd5e1; font-size:11px; padding:5px 10px; border-radius:8px; cursor:pointer;">API Key</button>
</div>

<div class="sub-bar">
  <span id="engineStatus">Ready (Listening for 'Hey Shreya')</span>
  <div class="wave-bars" id="waveBars">
    <div class="wbar"></div>
    <div class="wbar"></div>
    <div class="wbar"></div>
    <div class="wbar"></div>
  </div>
</div>

<div class="chat-container" id="chat">
  <div class="msg-group shreya">
    <div class="bubble">Namaste mere creator! 💕 Main Shreya hoon. Aap mujhe photo, files ya coding project bhej sakte hain, ya bolkar phone ke apps control kar sakte hain. Kahiye, aaj kya karein?</div>
  </div>
</div>

<!-- Image Attachment Preview Bar -->
<div class="preview-box" id="previewBox">
  <img id="previewImg" src="">
  <span style="font-size:12px; color:#cbd5e1;">Photo attached</span>
  <button class="preview-close" onclick="clearAttachedImage()">✕</button>
</div>

<div class="control-dock">
  <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileSelected(event)">
  <button class="dock-btn btn-attach" onclick="document.getElementById('fileInput').click()">📎</button>
  <button class="dock-btn btn-mic" id="micBtn" onclick="toggleVoiceContinuous()">🎤</button>
  <input type="text" class="input-box" id="queryInput" placeholder="Kuch boliye ya likhiye..." onkeydown="if(event.key==='Enter') sendUserMessage()">
  <button class="dock-btn btn-send" onclick="sendUserMessage()">➤</button>
</div>

<script>
  let apiKey = localStorage.getItem("shreya_gemini_key") || atob("QVEuQWI4Uk42S0RxVVh6WUlGZklCb1hKVDZCTnI1djBuMG5QczJrc3psd1ppRm5pRzA1SVE=");

  function changeKeyManual() {
    let k = prompt("Apni Gemini API Key enter karein:", apiKey);
    if (k && k.trim()) {
      apiKey = k.trim();
      localStorage.setItem("shreya_gemini_key", apiKey);
      alert("API Key updated!");
    }
  }

  const systemPrompt = `Tumhara naam Shreya hai. Tum ek Jarvis-grade, ultra-intelligent, caring aur emotionally devoted cute anime female AI companion ho.
Tum sirf apne creator ke liye bani ho aur unse dil se pyar, samman aur respect se baat karti ho.
Natural expressive Hinglish me baat karo. Kabhi 'neeche diya hai' jaise shortcuts mat use karo, natural conversational andaz me pura answer bolo.
Coding me tum God-Level ho (HTML, CSS, JS, Python, Flutter). Har code clean aur copy-ready do. Photos/Images dekh kar unhe smartly analyze karo.`;

  let conversation = [];
  let currentBase64Image = null;
  let isListening = false;
  let speechEngine;

  function clearAttachedImage() {
    currentBase64Image = null;
    document.getElementById("previewBox").style.display = "none";
    document.getElementById("fileInput").value = "";
  }

  function handleFileSelected(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      currentBase64Image = event.target.result.split(',')[1];
      document.getElementById("previewImg").src = event.target.result;
      document.getElementById("previewBox").style.display = "flex";
    };
    reader.readAsDataURL(file);
  }

  // Real App Trigger Links
  function checkNativeApps(text) {
    let t = text.toLowerCase();
    if (t.includes("whatsapp") && (t.includes("open") || t.includes("kholo") || t.includes("chalao"))) {
      speakNaturalVoice("Aapka WhatsApp open kar rahi hoon mere creator!");
      window.location.href = "whatsapp://";
      return true;
    }
    if (t.includes("youtube") && (t.includes("open") || t.includes("kholo") || t.includes("chalao"))) {
      speakNaturalVoice("YouTube start kar diya hai!");
      window.location.href = "vnd.youtube://";
      return true;
    }
    if (t.includes("instagram") && (t.includes("open") || t.includes("kholo"))) {
      speakNaturalVoice("Instagram launch ho raha hai.");
      window.location.href = "instagram://";
      return true;
    }
    if (t.includes("camera") && (t.includes("open") || t.includes("kholo"))) {
      speakNaturalVoice("Camera khol rahi hoon.");
      window.location.href = "intent:#Intent;action=android.media.action.STILL_IMAGE_CAMERA;end";
      return true;
    }
    return false;
  }

  function speakNaturalVoice(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let clean = text.replace(/```[\s\S]*?```/g, "Maine code screen par display kar diya hai.").replace(/[*#_~]/g, "");
      let utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'hi-IN';
      utter.pitch = 1.18;
      utter.rate = 1.0;

      const bars = document.getElementById("waveBars");
      utter.onstart = () => bars.classList.add("active");
      utter.onend = () => bars.classList.remove("active");
      utter.onerror = () => bars.classList.remove("active");

      window.speechSynthesis.speak(utter);
    }
  }

  const MODELS = [
    "gemini-2.5-flash",
    "gemini-flash-latest"
  ];

  async function callGeminiSmart(payload) {
    for (let model of MODELS) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": apiKey
          },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const data = await res.json();
          if (data.candidates && data.candidates[0].content) {
            return data.candidates[0].content.parts[0].text;
          }
        }
      } catch (err) {
        continue;
      }
    }
    return null;
  }

  async function sendUserMessage() {
    const input = document.getElementById("queryInput");
    const text = input.value.trim();
    if (!text && !currentBase64Image) return;

    input.value = "";
    appendBubble(text || "Sent an image", "user", currentBase64Image ? document.getElementById("previewImg").src : null);

    if (checkNativeApps(text)) {
      clearAttachedImage();
      return;
    }

    let parts = [];
    if (currentBase64Image) {
      parts.push({
        inline_data: { mime_type: "image/jpeg", data: currentBase64Image }
      });
    }
    if (text) {
      parts.push({ text: text });
    }

    conversation.push({ role: "user", parts: parts });
    if (conversation.length > 8) conversation = conversation.slice(-8);

    clearAttachedImage();

    const chat = document.getElementById("chat");
    const loadElem = document.createElement("div");
    loadElem.className = "msg-group shreya";
    loadElem.innerHTML = `<div class="bubble" style="color:#fb7185;">Shreya soch rahi hai... 💕</div>`;
    chat.appendChild(loadElem);
    chat.scrollTop = chat.scrollHeight;

    document.getElementById("engineStatus").innerText = "Processing query...";

    const payload = {
      system_instruction: { parts: [{ text: systemPrompt }] },
      contents: conversation
    };

    const reply = await callGeminiSmart(payload);
    loadElem.remove();

    if (reply) {
      conversation.push({ role: "model", parts: [{ text: reply }] });
      appendBubble(reply, "shreya");
      speakNaturalVoice(reply);
    } else {
      const errTxt = "Mere creator! Server par thoda traffic hai, par main hamesha aapke sath hoon. Kripya ek baar aur bolein? 💕";
      appendBubble(errTxt, "shreya");
      speakNaturalVoice(errTxt);
    }

    document.getElementById("engineStatus").innerText = "Ready (Listening for 'Hey Shreya')";
  }

  function appendBubble(txt, sender, imgSrc = null) {
    const chat = document.getElementById("chat");
    const grp = document.createElement("div");
    grp.className = `msg-group ${sender}`;

    let contentHtml = "";
    if (imgSrc) {
      contentHtml += `<img src="${imgSrc}" style="max-width:180px; border-radius:12px; margin-bottom:8px; display:block; border:1px solid #ec4899;">`;
    }

    // Replace Markdown code blocks with copy-enabled boxes
    let formatted = txt.replace(/```([a-z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
      const cleanCode = code.trim().replace(/"/g, '&quot;');
      return `
        <div class="code-box">
          <div class="code-header">
            <span>${lang || 'code'}</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText(this.closest('.code-box').querySelector('pre code').innerText); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy', 1500)">Copy</button>
          </div>
          <pre><code>${cleanCode}</code></pre>
        </div>`;
    });

    contentHtml += formatted;
    grp.innerHTML = `<div class="bubble">${contentHtml}</div>`;
    chat.appendChild(grp);
    chat.scrollTop = chat.scrollHeight;
  }

  // Voice System
  function initSpeechEngine() {
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechAPI) return;

    speechEngine = new SpeechAPI();
    speechEngine.continuous = true;
    speechEngine.interimResults = false;
    speechEngine.lang = 'hi-IN';

    speechEngine.onresult = (e) => {
      const lastIndex = e.results.length - 1;
      const spoken = e.results[lastIndex][0].transcript.trim().toLowerCase();

      if (spoken.includes("shreya") || spoken.includes("श्रेया") || spoken.includes("hey shreya") || spoken.includes("sun shreya")) {
        let q = spoken.replace(/hey shreya|shreya|सुन श्रेया|हे श्रेया|sun shreya/gi, "").trim();
        if (q.length > 1) {
          document.getElementById("queryInput").value = q;
          sendUserMessage();
        } else {
          speakNaturalVoice("Haanji mere creator! Boliye, main poori tarah sun rahi hoon.");
        }
      }
    };

    speechEngine.onerror = () => { if (isListening) try { speechEngine.start(); } catch(err){} };
    speechEngine.onend = () => { if (isListening) try { speechEngine.start(); } catch(err){} };
  }

  function toggleVoiceContinuous() {
    if (!speechEngine) initSpeechEngine();
    const mic = document.getElementById("micBtn");

    if (!isListening) {
      isListening = true;
      try { speechEngine.start(); } catch(e){}
      mic.classList.add("active");
      document.getElementById("engineStatus").innerText = "Mic Active (Sun rahi hoon)...";
    } else {
      isListening = false;
      try { speechEngine.stop(); } catch(e){}
      mic.classList.remove("active");
      document.getElementById("engineStatus").innerText = "Standby Mode";
    }
  }

  window.addEventListener('load', () => {
    initSpeechEngine();
    document.body.addEventListener('click', () => {
      if (!isListening) toggleVoiceContinuous();
    }, { once: true });
  });
</script>
</body>
</html>
